<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#060607" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Al-Nassr — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#060607;
    font-family:'Archivo',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  .stage{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(700px 500px at 18% 0%, rgba(232,185,72,.10), transparent 60%),
      radial-gradient(700px 600px at 100% 100%, rgba(127,227,255,.06), transparent 55%),
      #060607;
  }
  .device{
    width:392px;height:846px;position:relative;flex:none;
    transform-origin:center center;
  }
  .screen{
    position:absolute;inset:0;width:392px;height:846px;border:0;
    display:none;background:#0A0A0B;
  }
  .screen.on{display:block}

  /* prototype menu button */
  .menu-btn{
    position:fixed;top:8px;right:8px;z-index:50;width:34px;height:34px;border-radius:10px;
    border:1px solid rgba(232,185,72,.4);cursor:pointer;
    background:rgba(10,10,11,.6);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s ease;
  }
  .menu-btn:active{transform:scale(.9)}

  /* overlay */
  .overlay{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(6,6,7,.92);backdrop-filter:blur(14px);
    flex-direction:column;padding:34px 22px;
  }
  .overlay.on{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .ov-head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
  .ov-crest{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.25),transparent 55%),
      linear-gradient(150deg,#FFD66B,#9a7414);
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:17px;color:#1a1407;
  }
  .ov-head .ovt b{font-size:14px;font-weight:900;color:#F4F2EE;letter-spacing:-.01em;display:block}
  .ov-head .ovt small{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#E8B948}
  .ov-close{
    margin-left:auto;width:32px;height:32px;border-radius:9px;cursor:pointer;
    border:1px solid rgba(244,242,238,.12);background:rgba(255,255,255,.05);
    color:#F4F2EE;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;
  }
  .ov-hint{font-size:11px;color:rgba(244,242,238,.5);font-weight:600;margin:14px 2px 14px;line-height:1.5}
  .ov-list{display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .ov-card{
    display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(244,242,238,.1);background:rgba(255,255,255,.04);
    font-family:inherit;transition:.15s ease;text-align:left;
  }
  .ov-card:active{transform:scale(.98)}
  .ov-card.cur{border-color:rgba(232,185,72,.5);background:rgba(232,185,72,.1)}
  .ov-num{
    width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:900;color:#E8B948;
    background:rgba(232,185,72,.12);border:1px solid rgba(232,185,72,.25);
    font-variant-numeric:tabular-nums;
  }
  .ov-meta{flex:1}
  .ov-meta b{font-size:13.5px;font-weight:900;color:#F4F2EE;display:block}
  .ov-meta small{font-size:10.5px;font-weight:600;color:rgba(244,242,238,.5)}
  .ov-foot{margin-top:16px;font-size:10px;color:rgba(244,242,238,.32);font-weight:600;
    text-align:center;line-height:1.6}
</style>
</head>
<body>

  <div class="stage">
    <div class="device" id="device">
<iframe class="screen" data-screen="onboarding" title="onboarding"></iframe>
<iframe class="screen" data-screen="home" title="home"></iframe>
<iframe class="screen" data-screen="matchday" title="matchday"></iframe>
<iframe class="screen" data-screen="explore" title="explore"></iframe>
<iframe class="screen" data-screen="community" title="community"></iframe>
<iframe class="screen" data-screen="shop" title="shop"></iframe>
    </div>
  </div>

  <button class="menu-btn" id="menuBtn" aria-label="Screens">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.2">
      <rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>
      <rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>
    </svg>
  </button>

  <div class="overlay" id="overlay">
    <div class="ov-head">
      <div class="ov-crest">N</div>
      <div class="ovt"><b>Al-Nassr App</b><small>Interactive Prototype</small></div>
      <div class="ov-close" id="ovClose">&times;</div>
    </div>
    <div class="ov-hint">Tap any screen to jump there. Inside the app, use the bottom navigation to move between Home, Matchday, Explore, Community &amp; Shop.</div>
    <div class="ov-list" id="ovList">
<button class="ov-card" data-go="onboarding"><span class="ov-num">01</span><span class="ov-meta"><b>Onboarding</b><small>Intent fork</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="ov-card" data-go="home"><span class="ov-num">02</span><span class="ov-meta"><b>Home Feed</b><small>AI feed</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="ov-card" data-go="matchday"><span class="ov-num">03</span><span class="ov-meta"><b>Matchday</b><small>Live center</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="ov-card" data-go="explore"><span class="ov-num">04</span><span class="ov-meta"><b>Explore</b><small>Discovery</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="ov-card" data-go="community"><span class="ov-num">05</span><span class="ov-meta"><b>Community</b><small>Fan space</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
<button class="ov-card" data-go="shop"><span class="ov-num">06</span><span class="ov-meta"><b>Shop</b><small>Commerce</small></span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFD66B" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="ov-foot">6 screens &middot; one design system &middot; built for mobile</div>
  </div>

<script type="text/html" id="src-onboarding"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Al-Nassr — Onboarding · Hi-Fi Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B; --surface:#141416; --surface-2:#1c1c1f;
    --gold:#E8B948; --gold-bright:#FFD66B; --gold-deep:#9a7414;
    --text:#F4F2EE; --muted:rgba(244,242,238,.56); --faint:rgba(244,242,238,.30);
    --ai:#7FE3FF; --line:rgba(244,242,238,.10);
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:
      radial-gradient(900px 600px at 15% 0%, rgba(232,185,72,.10), transparent 60%),
      radial-gradient(800px 700px at 100% 100%, rgba(127,227,255,.06), transparent 55%),
      #060607;
    color:var(--text);min-height:100%;
    display:flex;flex-direction:column;align-items:center;
    padding:48px 16px;gap:26px;
  }
  .page-head{text-align:center;max-width:430px}
  .page-head .kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .page-head h1{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-top:8px}
  .page-head p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.55}

  .phone{
    position:relative;width:392px;height:846px;border-radius:54px;
    background:var(--bg);overflow:hidden;
    border:1px solid rgba(232,185,72,.16);
    box-shadow:0 0 0 11px #0c0c0d,0 0 0 12px rgba(232,185,72,.10),
      0 50px 120px -30px rgba(0,0,0,.9),0 0 90px -20px rgba(232,185,72,.14);
    flex:none;display:flex;flex-direction:column;
  }
  .phone::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:120;
    opacity:.5;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;height:30px;background:#060607;border-radius:0 0 18px 18px;z-index:115}

  .statusbar{
    height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 7px;font-size:13px;font-weight:700;z-index:30;
  }
  .statusbar .dots{display:flex;gap:5px;align-items:center}
  .statusbar .dots span{width:4px;height:4px;border-radius:50%;background:var(--text)}
  .statusbar .bat{width:22px;height:11px;border:1.4px solid var(--text);border-radius:3px;position:relative;opacity:.9}
  .statusbar .bat::before{content:"";position:absolute;inset:1.6px;width:70%;background:var(--text);border-radius:1px}
  .statusbar .bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:4px;background:var(--text);border-radius:0 1px 1px 0}

  /* top nav: back + progress + skip */
  .topnav{
    flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;z-index:30;
  }
  .backbtn{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex:none;transition:.2s var(--ease);
  }
  .backbtn.hide{opacity:0;pointer-events:none}
  .progress{flex:1;display:flex;gap:4px}
  .progress i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:.4s var(--ease)}
  .progress i.done{background:var(--gold-bright)}
  .skip{
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:none;border:0;cursor:pointer;flex:none;
  }
  .skip.hide{visibility:hidden}

  /* steps */
  .steps{flex:1;position:relative;overflow:hidden}
  .step{
    position:absolute;inset:0;display:none;flex-direction:column;
  }
  .step.on{display:flex}
  .step.on .anim{animation:reveal .55s var(--ease) backwards}
  .step.on .anim:nth-child(1){animation-delay:.04s}
  .step.on .anim:nth-child(2){animation-delay:.11s}
  .step.on .anim:nth-child(3){animation-delay:.18s}
  .step.on .anim:nth-child(4){animation-delay:.25s}
  .step.on .anim:nth-child(5){animation-delay:.32s}
  .step.on .anim:nth-child(6){animation-delay:.39s}

  .body{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 24px 4px}
  .body::-webkit-scrollbar{display:none}
  .cta-area{flex:none;padding:14px 24px 24px}
  .cta{
    width:100%;border:0;cursor:pointer;font-family:inherit;
    padding:15px;border-radius:14px;font-weight:900;font-size:13.5px;
    letter-spacing:.06em;text-transform:uppercase;color:#1a1407;
    background:linear-gradient(110deg,var(--gold-bright),var(--gold));
    box-shadow:0 12px 30px -10px rgba(232,185,72,.7);
    transition:.18s var(--ease);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .cta:active{transform:scale(.97)}
  .cta.dim{opacity:.32;pointer-events:none;box-shadow:none}
  .cta-note{text-align:center;font-size:10.5px;color:var(--faint);margin-top:10px;font-weight:500;line-height:1.5}

  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .title{font-size:25px;font-weight:900;letter-spacing:-.02em;line-height:1.08}
  .title em{font-style:normal;color:var(--gold-bright)}
  .lede{font-size:13px;color:var(--muted);line-height:1.55;margin-top:10px;font-weight:500}

  /* ===== STEP 1 — WELCOME ===== */
  .welcome{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 24px;overflow:hidden}
  .welcome .atmos{position:absolute;inset:0;z-index:0}
  .welcome .atmos .beam{position:absolute;border-radius:50%;filter:blur(60px)}
  .welcome .b1{width:300px;height:300px;top:-40px;left:-80px;background:rgba(232,185,72,.32)}
  .welcome .b2{width:260px;height:260px;top:120px;right:-100px;background:rgba(232,185,72,.16)}
  .welcome .ghost{
    position:absolute;top:80px;left:50%;transform:translateX(-50%);
    font-size:240px;font-weight:900;color:rgba(255,255,255,.04);z-index:0;letter-spacing:-.04em;
  }
  .crest-xl{
    position:relative;z-index:2;width:84px;height:84px;border-radius:24px;
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.3),transparent 55%),
      linear-gradient(150deg,var(--gold-bright),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 44px -12px rgba(232,185,72,.7);margin-bottom:20px;
  }
  .crest-xl b{font-size:38px;font-weight:900;color:#1a1407}
  .welcome .wt{position:relative;z-index:2;font-size:34px;font-weight:900;letter-spacing:-.025em;line-height:1.02}
  .welcome .wt em{font-style:normal;color:var(--gold-bright)}
  .welcome .ws{position:relative;z-index:2;font-size:13.5px;color:var(--muted);
    line-height:1.55;margin-top:12px;font-weight:500;max-width:290px}
  .auth{position:relative;z-index:2;margin-top:26px;display:flex;flex-direction:column;gap:9px;padding-bottom:26px}
  .authbtn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:13px;border-radius:13px;font-family:inherit;font-weight:800;font-size:12.5px;
    cursor:pointer;transition:.18s var(--ease);
  }
  .authbtn:active{transform:scale(.98)}
  .authbtn.primary{background:var(--text);color:#0a0a0b;border:0}
  .authbtn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text)}
  .authbtn .x{font-size:15px}

  /* ===== STEP 2 — INTENT FORK ===== */
  .pickcard{
    display:flex;gap:13px;align-items:flex-start;padding:15px;margin-top:11px;
    border-radius:16px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    transition:.22s var(--ease);
  }
  .pickcard:active{transform:scale(.985)}
  .pickcard.sel{border-color:var(--gold);background:rgba(232,185,72,.1);
    box-shadow:0 0 30px -14px rgba(232,185,72,.6)}
  .pickcard .pic{
    width:46px;height:46px;border-radius:13px;flex:none;display:flex;
    align-items:center;justify-content:center;font-size:21px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.22s var(--ease);
  }
  .pickcard.sel .pic{background:linear-gradient(150deg,var(--gold-bright),var(--gold-deep));border-color:transparent}
  .pickcard .pt{flex:1}
  .pickcard .pt b{font-size:14px;font-weight:900;display:block}
  .pickcard .pt small{font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.45;display:block;margin-top:3px}
  .pickcard .chk{
    width:22px;height:22px;border-radius:50%;flex:none;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);
  }
  .pickcard.sel .chk{background:var(--gold-bright);border-color:var(--gold-bright)}
  .pickcard .chk svg{opacity:0;transition:.2s var(--ease)}
  .pickcard.sel .chk svg{opacity:1}

  /* ===== STEP 3 — PLAYERS ===== */
  .counter{
    display:inline-flex;align-items:center;gap:6px;margin-top:12px;
    font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--gold-bright);background:rgba(232,185,72,.12);
    border:1px solid rgba(232,185,72,.3);padding:5px 10px;border-radius:8px;
  }
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
  .pchip{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;
    border-radius:14px;cursor:pointer;position:relative;
    border:1px solid var(--line);background:rgba(255,255,255,.04);
    transition:.18s var(--ease);
  }
  .pchip:active{transform:scale(.94)}
  .pchip.sel{border-color:var(--gold);background:rgba(232,185,72,.1)}
  .pchip .pa{
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;
    background:linear-gradient(150deg,#4a4f57,#23252a);color:var(--text);
    border:2px solid rgba(255,255,255,.18);transition:.18s var(--ease);
  }
  .pchip.sel .pa{
    background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.3),transparent 55%),
      linear-gradient(150deg,var(--gold-bright),var(--gold-deep));color:#1a1407;border-color:#1a1407;
    box-shadow:0 0 16px -2px rgba(232,185,72,.7);
  }
  .pchip .pn{font-size:11px;font-weight:800;text-align:center;line-height:1.1}
  .pchip .pp{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.06em}
  .pchip .badge{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    background:var(--gold-bright);color:#1a1407;font-size:10px;font-weight:900;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);
    transform:scale(0);transition:.2s var(--ease);
  }
  .pchip.sel .badge{transform:scale(1)}

  /* ===== STEP 4 — LANGUAGE ===== */
  .langrow{
    display:flex;align-items:center;gap:12px;padding:13px 15px;margin-top:9px;
    border-radius:13px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.18s var(--ease);
  }
  .langrow.sel{border-color:var(--gold);background:rgba(232,185,72,.1)}
  .langrow .fl{font-size:22px;flex:none}
  .langrow .ln{flex:1}
  .langrow .ln b{font-size:13px;font-weight:800;display:block}
  .langrow .ln small{font-size:11px;color:var(--muted);font-weight:600}
  .langrow .radio{
    width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;transition:.2s var(--ease);
  }
  .langrow.sel .radio{border-color:var(--gold-bright)}
  .langrow .radio::after{content:"";width:10px;height:10px;border-radius:50%;
    background:var(--gold-bright);transform:scale(0);transition:.2s var(--ease)}
  .langrow.sel .radio::after{transform:scale(1)}

  /* ===== STEP 5 — NOTIFICATIONS ===== */
  .notifrow{
    display:flex;align-items:center;gap:12px;padding:14px 15px;margin-top:9px;
    border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  }
  .notifrow .ni{
    width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:17px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  }
  .notifrow .nt{flex:1}
  .notifrow .nt b{font-size:12.5px;font-weight:800;display:block}
  .notifrow .nt small{font-size:10.5px;color:var(--muted);font-weight:600}
  .switch{
    width:44px;height:26px;border-radius:999px;flex:none;cursor:pointer;position:relative;
    background:rgba(255,255,255,.12);border:1px solid var(--line);transition:.22s var(--ease);
  }
  .switch::after{

<script>
  const steps=[...document.querySelectorAll('.step')];
  const dots=[...document.querySelectorAll('#progress i')];
  const backbtn=document.getElementById('backbtn');
  const skip=document.getElementById('skip');
  let cur=0;
  const state={intent:null,players:[],lang:'English'};

  function render(){
    steps.forEach((s,i)=>s.classList.toggle('on',i===cur));
    dots.forEach((d,i)=>d.classList.toggle('done',i<=cur));
    backbtn.classList.toggle('hide',cur===0);
    // skip visible only on optional steps (lang, notifs)
    skip.classList.toggle('hide',!(cur===3||cur===4));
    document.querySelector('.steps').scrollTop=0;
    if(cur===5)buildSummary();
  }
  function go(n){cur=Math.max(0,Math.min(steps.length-1,n));render();}

  document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>go(cur+1)));
  document.querySelectorAll('[data-finish]').forEach(b=>b.addEventListener('click',()=>{
    b.textContent='Loading your feed…';
  }));
  backbtn.addEventListener('click',()=>go(cur-1));
  skip.addEventListener('click',()=>go(cur+1));

  // intent fork
  const intentCta=steps[1].querySelector('.cta');
  steps[1].querySelectorAll('[data-pick="intent"]').forEach(c=>{
    c.addEventListener('click',()=>{
      steps[1].querySelectorAll('[data-pick="intent"]').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      state.intent=c.dataset.val;
      intentCta.classList.remove('dim');
    });
  });

  // players
  const pcount=document.getElementById('pcount');
  const playerCta=steps[2].querySelector('.cta');
  function refreshPlayers(){
    pcount.textContent=state.players.length+' of 3 selected';
    playerCta.classList.toggle('dim',state.players.length===0);
    let n=0;
    steps[2].querySelectorAll('.pchip').forEach(ch=>{
      if(ch.classList.contains('sel')){n++;ch.querySelector('.badge').textContent=n;}
    });
  }
  steps[2].querySelectorAll('.pchip').forEach(ch=>{
    ch.addEventListener('click',()=>{
      const p=ch.dataset.player;
      if(ch.classList.contains('sel')){
        ch.classList.remove('sel');
        state.players=state.players.filter(x=>x!==p);
      }else if(state.players.length<3){
        ch.classList.add('sel');
        state.players.push(p);
      }
      refreshPlayers();
    });
  });

  // language
  steps[3].querySelectorAll('[data-lang]').forEach(r=>{
    r.addEventListener('click',()=>{
      steps[3].querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('sel'));
      r.classList.add('sel');
      state.lang=r.dataset.lang;
    });
  });

  // notification switches
  document.querySelectorAll('[data-switch]').forEach(s=>{
    s.addEventListener('click',()=>s.classList.toggle('on'));
  });

  // summary
  function buildSummary(){
    const labels={global:'Player highlights',core:'The full Al-Nassr ride',both:'Everything'};
    document.getElementById('sumIntent').textContent=labels[state.intent]||'Everything';
    document.getElementById('sumPlayers').textContent=
      state.players.length?state.players.join(', '):'Top players for you';
    document.getElementById('sumLang').textContent=state.lang;
  }

  render();
<\/script>
<script>
(function(){
function nav(s){try{parent.postMessage({alnassrNav:s},'*');}catch(e){}}
function wire(){
  document.querySelectorAll('.nav .navbtn').forEach(function(b){
    var t=(b.textContent||'').toLowerCase();
    b.addEventListener('click',function(){
      if(t.indexOf('home')>-1)nav('home');
      else if(t.indexOf('explore')>-1)nav('explore');
      else if(t.indexOf('community')>-1)nav('community');
      else if(t.indexOf('shop')>-1)nav('shop');
    });
  });
  var c=document.querySelector('.nav .center');
  if(c)c.addEventListener('click',function(){nav('matchday');});
  document.querySelectorAll('[data-finish]').forEach(function(b){
    b.addEventListener('click',function(){setTimeout(function(){nav('home');},650);});
  });
  var ml=document.querySelector('.cta-live');
  if(ml)ml.addEventListener('click',function(){nav('matchday');});
}
if(document.readyState!=='loading')wire();else document.addEventListener('DOMContentLoaded',wire);
})();
<\/script>

  // AI recap expand
  document.querySelectorAll('[data-recap]').forEach(el=>{

  });

  // engagement reactions
  function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n}
  document.querySelectorAll('[data-react]').forEach(r=>{
    const n=r.querySelector('.n');
    const hasCount=r.dataset.base!==undefined;
    let base=hasCount?+r.dataset.base:0, liked=false;
    r.addEventListener('click',()=>{
      liked=!liked;
      r.classList.toggle('on',liked);
      r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');
      if(hasCount) n.textContent=fmt(base+(liked?1:0));
    });
  });

  // segmented control
  document.querySelectorAll('.seg button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });

  // bottom nav
  document.querySelectorAll('.nav .navbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.nav .navbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });

  // feed scroll → progress dots + live state
  const feed=document.getElementById('feed');
  const cards=[...feed.querySelectorAll('.card')];
  const dots=[...document.querySelectorAll('#progress i')];
  const liveTab=document.querySelector('.seg .live-tab');
  feed.addEventListener('scroll',()=>{
    const idx=Math.round(feed.scrollTop/feed.clientHeight);
    dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
    const onLive=cards[idx]&&cards[idx].hasAttribute('data-livecard');
    liveTab.style.boxShadow=onLive?'0 0 18px -2px rgba(255,91,74,.7)':'none';
  },{passive:true});
<\/script>

      else if(t.indexOf('community')>-1)nav('community');

  if(ml)ml.addEventListener('click',function(){nav('matchday');});
}

<script>
  // sub-tabs
  const tabs=document.querySelectorAll('#subtabs button');
  const panels=document.querySelectorAll('.panel');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('on'));
    panels.forEach(p=>p.classList.remove('on'));
    t.classList.add('on');
    document.querySelector('[data-panel="'+t.dataset.tab+'"]').classList.add('on');
  }));

  // prediction select (one per card group)
  document.querySelectorAll('.predcard').forEach(card=>{
    card.querySelectorAll('[data-opt]').forEach(o=>{
      o.addEventListener('click',()=>{
        card.querySelectorAll('[data-opt]').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel');
      });
    });
  });

  // reaction bar — floating emoji
  const bar=document.getElementById('reactbar');
  const countEl=document.getElementById('reactCount');
  let rc=2400;
  function fmtk(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n}
  function spawn(emoji,x){
    const f=document.createElement('div');
    f.className='floatr';f.textContent=emoji;
    f.style.left=(x-11)+'px';
    f.style.bottom='70px';
    f.style.animationDuration=(1.5+Math.random()*0.8)+'s';
    bar.appendChild(f);
    setTimeout(()=>f.remove(),2400);
  }
  document.querySelectorAll('.rbtn').forEach(b=>{
    b.addEventListener('click',e=>{
      const r=b.getBoundingClientRect(),br=bar.getBoundingClientRect();
      for(let i=0;i<3;i++){
        setTimeout(()=>spawn(b.dataset.emoji,r.left-br.left+23+(Math.random()*30-15)),i*90);
      }
      rc+=Math.floor(3+Math.random()*9);
      countEl.textContent=fmtk(rc);
    });
  });

  // ambient live reactions
  const emojis=['🔥','💛','⚽','👏','😤'];
  setInterval(()=>{
    spawn(emojis[Math.floor(Math.random()*emojis.length)],40+Math.random()*300);
    rc+=Math.floor(Math.random()*4);
    countEl.textContent=fmtk(rc);
  },2200);

  // momentum drift + clock
  const push=document.getElementById('push');
  push.style.width='64%';
  setInterval(()=>{push.style.width=(52+Math.random()*26).toFixed(0)+'%'},3000);

  // prediction countdown
  let secs=134;const cd=document.getElementById('predcd');
  setInterval(()=>{
    if(secs>0)secs--;
    cd.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  },1000);
<\/script>

<script>
(function(){
function nav(s){try{parent.postMessage({alnassrNav:s},'*');}catch(e){}}
function wire(){
  document.querySelectorAll('.nav .navbtn').forEach(function(b){
    var t=(b.textContent||'').toLowerCase();
    b.addEventListener('click',function(){
      if(t.indexOf('home')>-1)nav('home');
      else if(t.indexOf('explore')>-1)nav('explore');
      else if(t.indexOf('community')>-1)nav('community');
      else if(t.indexOf('shop')>-1)nav('shop');
    });
  });
  var c=document.querySelector('.nav .center');
  if(c)c.addEventListener('click',function(){nav('matchday');});
  document.querySelectorAll('[data-finish]').forEach(function(b){
    b.addEventListener('click',function(){setTimeout(function(){nav('home');},650);});
  });
  var ml=document.querySelector('.cta-live');
  if(ml)ml.addEventListener('click',function(){nav('matchday');});
}
if(document.readyState!=='loading')wire();else document.addEventListener('DOMContentLoaded',wire);
})();

  // subtabs
  const tabs=document.querySelectorAll('#subtabs button');
  const panels=document.querySelectorAll('.panel');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('on'));
    panels.forEach(p=>p.classList.remove('on'));
    t.classList.add('on');
    document.querySelector('[data-panel="'+t.dataset.tab+'"]').classList.add('on');
    document.querySelector('.content').scrollTop=0;
  }));

  // post reactions
  function fmt(n){return n>=1000?(n/1000).toFixed(1).replace('.0','')+'K':n}
  document.querySelectorAll('[data-react]').forEach(r=>{
    const ct=r.querySelector('.ct');let base=+r.dataset.base,liked=false;
    r.addEventListener('click',()=>{
      liked=!liked;r.classList.toggle('on',liked);
      r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');
      ct.textContent=fmt(base+(liked?1:0));
    });
  });

  // rooms join
  document.querySelectorAll('.joinbtn').forEach(b=>{
    if(b.classList.contains('joined'))return;
    b.addEventListener('click',()=>{
      const live=b.closest('.room').classList.contains('live');
      if(live){b.textContent='Inside';}
      else{b.classList.add('joined');b.textContent='Joined';}
    });
  });

  // polls voting
  document.querySelectorAll('[data-poll]').forEach(poll=>{
    poll.querySelectorAll('[data-opt]').forEach(opt=>{
      opt.addEventListener('click',()=>{
        if(poll.classList.contains('voted'))return;
        poll.classList.add('voted');
        poll.querySelectorAll('[data-opt]').forEach(o=>{
          o.querySelector('.fill').style.width=o.dataset.pct+'%';
        });
        opt.classList.add('sel');
      });
    });
  });

  // bottom nav
  document.querySelectorAll('.nav .navbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.nav .navbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });

  // fab
  document.getElementById('fab').addEventListener('click',function(){
    this.style.transform='scale(0.9)';
    setTimeout(()=>this.style.transform='',150);
  });
<\/script>

}

})();

<script>
  // subtabs
  const tabs=document.querySelectorAll('#subtabs button');
  const panels=document.querySelectorAll('.panel');
  tabs.forEach(t=>t.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('on'));
    panels.forEach(p=>p.classList.remove('on'));
    t.classList.add('on');
    document.querySelector('[data-panel="'+t.dataset.tab+'"]').classList.add('on');
    document.getElementById('content').scrollTop=0;
  }));

  // ticket tier select
  document.querySelectorAll('[data-tier]').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('[data-tier]').forEach(x=>x.classList.remove('sel'));
      t.classList.add('sel');
    });
  });

  // cart
  let count=0,total=0;
  const badge=document.getElementById('cartBadge');
  const checkout=document.getElementById('checkout');
  const coCount=document.getElementById('coCount');
  const coTotal=document.getElementById('coTotal');
  function refreshCart(){
    badge.textContent=count;
    badge.classList.toggle('show',count>0);
    coCount.textContent=count;
    coTotal.textContent=total.toLocaleString();
    checkout.classList.toggle('show',count>0);
  }
  document.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click',()=>{
      count++;total+=+b.dataset.price;
      if(b.classList.contains('addbtn'))b.classList.add('added');
      refreshCart();
    });
  });

  // membership join feedback
  document.querySelectorAll('[data-join]').forEach(b=>{
    b.addEventListener('click',()=>{b.textContent='Selected ✓';});
  });

  // bottom nav
  document.querySelectorAll('.nav .navbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.nav .navbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });

  // drop countdown
  let secs=8078;const cd=document.getElementById('dropcd');
  setInterval(()=>{
    if(secs>0)secs--;
    const h=Math.floor(secs/3600),m=Math.floor(secs%3600/60),s=secs%60;
    cd.textContent='⏳ '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
<\/script>
<script>
(function(){
function nav(s){try{parent.postMessage({alnassrNav:s},'*');}catch(e){}}
function wire(){
  document.querySelectorAll('.nav .navbtn').forEach(function(b){
    var t=(b.textContent||'').toLowerCase();
    b.addEventListener('click',function(){
      if(t.indexOf('home')>-1)nav('home');

      else if(t.indexOf('community')>-1)nav('community');
      else if(t.indexOf('shop')>-1)nav('shop');

  var c=document.querySelector('.nav .center');
  if(c)c.addEventListener('click',function(){nav('matchday');});
  document.querySelectorAll('[data-finish]').forEach(function(b){

  });
  var ml=document.querySelector('.cta-live');
  if(ml)ml.addEventListener('click',function(){nav('matchday');});
}
if(document.readyState!=='loading')wire();else document.addEventListener('DOMContentLoaded',wire);
})();

<script>
  var SCREENS=["onboarding","home","matchday","explore","community","shop"];
  var device=document.getElementById('device');
  var frames={};
  var current=null;

  // 1) nahraj každý mock do jeho iframu cez srcdoc property (žiadne HTML escapovanie)
  SCREENS.forEach(function(key){
    var tpl=document.getElementById('src-'+key);
    var html=tpl.textContent.split('<\\/script>').join('<\/script>');
    var fr=document.querySelector('.screen[data-screen="'+key+'"]');
    fr.srcdoc=html;
    frames[key]=fr;
  });

  // 2) prepínanie obrazoviek
  function show(key){
    if(!frames[key])return;
    SCREENS.forEach(function(k){frames[k].classList.toggle('on',k===key);});
    current=key;
    document.querySelectorAll('.ov-card').forEach(function(c){
      c.classList.toggle('cur',c.dataset.go===key);
    });
  }

  // 3) správy z iframov (klik na bottom-nav vnútri appky)
  window.addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.alnassrNav){show(d.alnassrNav);closeOverlay();}
  });

  // 4) škálovanie zariadenia na akúkoľvek veľkosť obrazovky
  function fit(){
    var s=Math.min(window.innerWidth/392,window.innerHeight/846,1);
    device.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,150);});
  fit();

  // 5) overlay menu
  var overlay=document.getElementById('overlay');
  function openOverlay(){overlay.classList.add('on');}
  function closeOverlay(){overlay.classList.remove('on');}
  document.getElementById('menuBtn').addEventListener('click',openOverlay);
  document.getElementById('ovClose').addEventListener('click',closeOverlay);
  document.querySelectorAll('.ov-card').forEach(function(c){
    c.addEventListener('click',function(){show(c.dataset.go);closeOverlay();});
  });

  // 6) štart na Onboarding
  show('onboarding');
</script>
</body>
</html>
